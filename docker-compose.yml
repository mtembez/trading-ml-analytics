services:
  db:
    image: postgres:16-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: trading_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: prod-trading-secret-key-change-in-production
      DJANGO_DEBUG: "1"
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_secure_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
